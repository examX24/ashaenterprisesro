<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASHA RO WATER — Instant Water & Recharge</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#1e3a5f 0%,#0072ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.header{background:linear-gradient(135deg,#0072ff,#00c6ff);color:#fff;padding:24px 20px;text-align:center}
.header h1{font-size:20px;margin-bottom:4px}
.header p{font-size:12px;opacity:.85}
.body{padding:20px}
.info-box{background:#f0f7ff;border-radius:12px;padding:16px;text-align:center;margin-bottom:20px;border:2px dashed #0072ff}
.customer-name{font-size:18px;font-weight:700;color:#1e3a5f;margin-bottom:4px}
.balance{font-size:36px;font-weight:800;color:#057a55;margin:8px 0}
.balance-lbl{font-size:12px;color:#6b7280}
.price-lbl{font-size:13px;color:#6b7280;margin-top:4px;background:#e1effe;padding:4px 10px;border-radius:6px;display:inline-block}
.amt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.amt-btn{padding:13px;border:2px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-weight:700;color:#0072ff;cursor:pointer;font-size:16px;transition:.15s}
.amt-btn:hover,.amt-btn.sel{background:#0072ff;color:#fff;border-color:#0072ff}
.form-group{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:#6b7280;margin-bottom:4px}
input{width:100%;padding:11px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#0072ff}
.pay-btn{width:100%;padding:14px;background:#0072ff;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;transition:.15s}
.pay-btn:hover{background:#1e429f}
.sim-badge{background:#fef3c7;color:#92400e;padding:6px 12px;border-radius:8px;font-size:12px;text-align:center;margin-bottom:14px}
.history-section{margin-top:20px;border-top:1px solid #e5e7eb;padding-top:16px}
.history-section h3{font-size:14px;font-weight:700;color:#374151;margin-bottom:10px}
.txn-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.txn-item:last-child{border:none}
.txn-type{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.type-recharge{background:#def7ec;color:#03543f}
.type-dispense{background:#fde8e8;color:#9b1c1c}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px}
.alert-success{background:#def7ec;color:#03543f}
.alert-error{background:#fde8e8;color:#9b1c1c}
.loading{text-align:center;padding:40px;color:#6b7280}
.blocked-msg{background:#fde8e8;border-radius:12px;padding:24px;text-align:center;color:#9b1c1c}
.footer{text-align:center;font-size:11px;color:#9ca3af;padding-top:12px;border-top:1px solid #f3f4f6;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>💧 ASHA RO WATER</h1>
    <p>Wallet Recharge & Balance Check</p>
  </div>
  <div class="body" id="mainBody">
    <div class="loading">⏳ Loading...</div>
  </div>
</div>

<script>
const customerId = window.location.pathname.split('/pay/')[1];

async function loadPage(){
  const mainBody = document.getElementById('mainBody');
  let displayName = "Instant Buyer";
  let balanceRs = "0.00";
  let pricePerLitre = "1.00";
  let isCustomer = false;

  if (customerId) {
    const res = await fetch(`/api/pay-info/${customerId}`).then(r=>r.json()).catch(()=>null);
    if(res && res.success){
      if(res.status === 'blocked'){
        mainBody.innerHTML = `
          <div class="blocked-msg">
            🚫 <b>Yeh card block kar diya gaya hai.</b><br><br>
            Kripya van operator se sampark karein.
          </div>`;
        return;
      }
      displayName = res.display_name;
      balanceRs = res.balance_rs;
      pricePerLitre = res.price_per_litre;
      isCustomer = true;
    }
  } else {
    // Machine direct QR mode
    const settings = await fetch('/api/settings').then(r=>r.json()).catch(()=>null);
    if (settings && settings.success) {
      pricePerLitre = settings.price_per_litre_rs;
    }
  }

  mainBody.innerHTML = `
    <div class="info-box">
      <div class="customer-name">👤 ${displayName}</div>
      ${isCustomer ? `<div class="balance-lbl">Available Balance</div><div class="balance">₹${balanceRs}</div>` : ''}
      <span class="price-lbl">💧 Paani ka rate: ₹${pricePerLitre} per litre</span>
    </div>

    <div class="sim-badge">⚠️ UPI QR Payment — Jitna paisa dalenge utna paani machine se niklega</div>
    <div id="alertBox"></div>

    <div class="form-group">
      <label>Kitna Paani / Amount Chahiye?</label>
      <div class="amt-grid">
        <button class="amt-btn" onclick="selAmt(10,this)">₹10 (10L)</button>
        <button class="amt-btn sel" onclick="selAmt(20,this)">₹20 (20L)</button>
        <button class="amt-btn" onclick="selAmt(50,this)">₹50 (50L)</button>
        <button class="amt-btn" onclick="selAmt(100,this)">₹100 (100L)</button>
      </div>
    </div>
    <div class="form-group">
      <label>Ya Custom Amount (₹)</label>
      <input type="number" id="customAmt" value="20" min="5" placeholder="Amount (e.g. 10, 20)">
    </div>
    <button class="pay-btn" style="background:#057a55;margin-bottom:8px;" onclick="instantWaterDispense()">🚰 UPI Pay Karke Abhi Paani Bharein</button>
    ${isCustomer ? `<button class="pay-btn" style="background:#0072ff;" onclick="simulatePay()">💳 Ya Wallet Recharge Karein</button>` : ''}

    <div class="history-section" id="histSection" style="${isCustomer ? '' : 'display:none'}">
      <h3>📋 Recent Transactions</h3>
      <div id="histBody">Loading...</div>
    </div>
    <div class="footer">ASHA RO WATER — Smart Dispenser</div>
  `;
  if(isCustomer) loadHistory();
}

function selAmt(v, btn){
  document.querySelectorAll('.amt-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('customAmt').value = v;
}

async function instantWaterDispense(){
  const amt = document.getElementById('customAmt').value;
  if(!amt || amt < 5){ showAlert('Minimum ₹5 ka paani le sakte hain', 'error'); return; }
  
  showAlert(`⏳ Razorpay Payment shuru ho raha hai (₹${amt})...`, 'success');
  
  // Step 1: Create Razorpay Order on Server
  const orderRes = await fetch('/api/razorpay/create-order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount_rs: amt, customer_id: customerId })
  }).then(r=>r.json()).catch(()=>null);

  if(!orderRes || !orderRes.success){
    showAlert(orderRes ? orderRes.message : 'Razorpay order create nahi hua. Local network check karein.', 'error');
    return;
  }

  // Step 2: Open Official Razorpay UPI Checkout
  const options = {
    key: orderRes.key_id,
    amount: orderRes.amount,
    currency: "INR",
    name: "ASHA RO WATER",
    description: `₹${amt} Paani Dispense`,
    order_id: orderRes.order_id,
    handler: async function (response) {
      showAlert('⏳ Payment capture ho gayi! Machine ko order bhej rahe hain...', 'success');
      
      // Step 3: Verify Payment & Trigger Machine
      const verifyRes = await fetch('/api/razorpay/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          razorpay_order_id: response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature,
          amount_rs: amt,
          customer_id: customerId
        })
      }).then(r=>r.json()).catch(()=>null);

      if (verifyRes && verifyRes.success) {
        showAlert(`🎉 ₹${amt} Payment Success! Machine ${verifyRes.litres} Liter paani bhar rahi hai!`, 'success');
        if(typeof loadHistory === 'function') loadHistory();
      } else {
        showAlert(verifyRes ? verifyRes.message : 'Verification error', 'error');
      }
    },
    prefill: {
      name: "Customer",
      contact: "9999999999"
    },
    theme: {
      color: "#057a55"
    }
  };

  const rzp = new Razorpay(options);
  rzp.on('payment.failed', function (response){
    showAlert('❌ Payment fail ho gayi: ' + response.error.description, 'error');
  });
  rzp.open();
}

async function simulatePay(){
  const amt = document.getElementById('customAmt').value;
  if(!amt || amt < 10){showAlert('Minimum ₹10 ka recharge karein','error');return;}
  const btn = document.querySelector('.pay-btn');
  btn.textContent = '⏳ Processing...';
  btn.disabled = true;

  const res = await fetch('/api/pay/upi-simulate',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:customerId, amount_rs:amt})
  }).then(r=>r.json());

  btn.textContent = '💳 UPI se Recharge Karein (TEST)';
  btn.disabled = false;

  if(res.success){
    showAlert(`✅ ₹${amt} successfully add ho gaya! New Balance: ₹${res.new_balance_rs}`, 'success');
    // Refresh balance
    const info = await fetch(`/api/pay-info/${customerId}`).then(r=>r.json());
    if(info.success) document.querySelector('.balance').textContent = '₹'+info.balance_rs;
    loadHistory();
  } else {
    showAlert(res.message, 'error');
  }
}

async function loadHistory(){
  const res = await fetch(`/api/transactions/${customerId}`).then(r=>r.json());
  const items = (res.data||[]).slice(0,5);
  document.getElementById('histBody').innerHTML = items.length ? items.map(t=>`
    <div class="txn-item">
      <div>
        <span class="txn-type type-${t.type.toLowerCase()}">${t.type}</span>
        <span style="font-size:11px;color:#9ca3af;margin-left:6px">${t.created_at.substring(0,16)}</span>
      </div>
      <b style="color:${t.type==='RECHARGE'?'#057a55':'#c81e1e'}">${t.type==='RECHARGE'?'+':'-'}₹${((t.amount_paise||0)/100).toFixed(2)}</b>
    </div>`).join('') : '<div style="text-align:center;color:#9ca3af;padding:10px">Koi transaction nahi</div>';
}

function showAlert(msg, type){
  const el = document.getElementById('alertBox');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(()=>el.innerHTML='', 6000);
}

loadPage();
</script>
</body>
</html>
